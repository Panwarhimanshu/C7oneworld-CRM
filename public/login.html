<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Sign in · C7oneworld</title>
  <link rel="icon" href="/assets/img/logo-48.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/core.css">
  <link rel="stylesheet" href="/assets/css/login.css">
  <script type="module" src="/assets/js/login.js"></script>
</head>
<body>
  <main class="login-wrap">
    <div class="login-panel">
      <div class="login-brand">
        <img src="/assets/img/logo-96.png" alt="" width="48" height="48">
        <div>
          <p class="login-product">C7oneworld</p>
          <p class="login-tag">Lead Management</p>
        </div>
      </div>

      <h1>Sign in to your workspace</h1>
      <p class="login-sub">Use the credentials provided by your administrator.</p>

      <div class="alert" id="login-alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="field" data-field="email">
          <label class="label" for="email">Work email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" required autofocus spellcheck="false" autocapitalize="off">
          <p class="field-error" hidden></p>
        </div>
        <div class="field" data-field="password">
          <div class="label-row">
            <label class="label" for="password">Password</label>
            <button type="button" class="btn-link small" id="toggle-pw" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
          <p class="field-error" hidden></p>
        </div>
        <button class="btn btn-primary btn-block login-submit" type="submit">Sign in</button>
      </form>

      <p class="login-foot">Forgot your password? Ask a Super Admin to reset it.</p>
    </div>
  </main>
</body>
</html>
